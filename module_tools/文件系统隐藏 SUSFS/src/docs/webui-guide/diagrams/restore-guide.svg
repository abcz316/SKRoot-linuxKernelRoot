<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">修改与撤销：保存项移除 ≠ 当前状态立即恢复</title>
<desc id="desc">对象规则删除后保存并应用可以重建规则表；高级全局项的不设置只停止写入，支持关闭的项目应明确关闭，bootconfig 清空后需重新加载或重启恢复。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9" fill="#7454a7"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1200" height="870" rx="0" fill="#f7f5fb"/>
<text x="48" y="42" font-size="16" fill="#7454a7" font-weight="600" text-anchor="start">SUSFS 0.3.0 · 配置教学图</text>
<text x="48" y="88" font-size="32" fill="#282236" font-weight="700" text-anchor="start">修改与撤销：保存项移除 ≠ 当前状态立即恢复</text>
<text x="48" y="123" font-size="20" fill="#696176" font-weight="400" text-anchor="start">先分清“对象规则”与“高级全局项”，再选择对应的撤销方法。</text>
<rect x="48" y="154" width="540" height="426" rx="18" fill="#ffffff" stroke="#ded6ed" stroke-width="1.5"/>
<rect x="612" y="154" width="540" height="426" rx="18" fill="#ffffff" stroke="#ded6ed" stroke-width="1.5"/>
<rect x="72" y="177" width="140" height="33" rx="16" fill="#eee7f7"/>
<text x="142.0" y="200" font-size="16" fill="#7454a7" font-weight="600" text-anchor="middle">对象规则</text>
<rect x="636" y="177" width="170" height="33" rx="16" fill="#eee7f7"/>
<text x="721.0" y="200" font-size="16" fill="#7454a7" font-weight="600" text-anchor="middle">高级全局项</text>
<text x="72" y="247" font-size="24" fill="#282236" font-weight="700" text-anchor="start">删除或修改规则后，重新应用</text>
<circle cx="92" cy="293" r="19" fill="#7454a7"/>
<text x="92" y="300" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="124" y="298" font-size="19" fill="#282236" font-weight="400" text-anchor="start">点击规则右侧删除，或编辑所需值。</text>
<circle cx="92" cy="362" r="19" fill="#7454a7"/>
<text x="92" y="369" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="124" y="367" font-size="19" fill="#282236" font-weight="400" text-anchor="start">点击底部悬浮“保存并应用”。</text>
<circle cx="92" cy="431" r="19" fill="#7454a7"/>
<text x="92" y="438" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="124" y="436" font-size="19" fill="#282236" font-weight="400" text-anchor="start">查看监控中的清理、添加和失败结果。</text>
<text x="72" y="512" font-size="19" fill="#696176" font-weight="400" text-anchor="start">五类对象表按顺序清理、逐条添加。</text>
<text x="72" y="543" font-size="19" fill="#696176" font-weight="400" text-anchor="start">不是自动回滚；部分失败需逐项处理。</text>
<rect x="636" y="240" width="492" height="117" rx="14" fill="#eee7f7"/>
<text x="658" y="277" font-size="22" fill="#7454a7" font-weight="700" text-anchor="start">不设置 / 清空字段</text>
<text x="658" y="311" font-size="18" fill="#696176" font-weight="400" text-anchor="start">从保存配置中移除该项，</text>
<text x="658" y="339" font-size="18" fill="#696176" font-weight="400" text-anchor="start">不保证恢复当前已应用的内核状态。</text>
<rect x="636" y="379" width="492" height="142" rx="14" fill="#edf7f1"/>
<text x="658" y="417" font-size="22" fill="#246b53" font-weight="700" text-anchor="start">支持“关闭”的功能：明确选关闭</text>
<text x="658" y="453" font-size="18" fill="#696176" font-weight="400" text-anchor="start">例如 uname、AVC、内核日志，</text>
<text x="658" y="481" font-size="18" fill="#696176" font-weight="400" text-anchor="start">选择关闭后保存并应用；</text>
<text x="658" y="509" font-size="18" fill="#696176" font-weight="400" text-anchor="start">uname 关闭同时移除自定义版本字段。</text>
<text x="636" y="555" font-size="18" fill="#696176" font-weight="400" text-anchor="start">全局项没有统一的“全部撤销”机制。</text>
<rect x="48" y="610" width="1104" height="171" rx="18" fill="#fff4e7"/>
<text x="74" y="652" font-size="24" fill="#8d5624" font-weight="700" text-anchor="start">启动信息 bootconfig 的恢复要单独处理</text>
<text x="74" y="692" font-size="20" fill="#282236" font-weight="400" text-anchor="start">清空 bootconfig / cmdline 兼容字段并“保存并应用”，只移除后续保存项。</text>
<text x="74" y="724" font-size="20" fill="#282236" font-weight="400" text-anchor="start">当前替换文本会保持到重新加载模块或重启；重启前确认保存配置中已移除旧内容。</text>
<text x="74" y="756" font-size="20" fill="#282236" font-weight="400" text-anchor="start">cmdline 是同一启动信息接口的兼容字段，当前实现不会改写 /proc/cmdline。</text>
<text x="48" y="845" font-size="15" fill="#696176" font-weight="400" text-anchor="start">0.3.0 教学示意 · 以当前界面及内核能力为准 · 不是设备效果证据</text>
</g>
</svg>
