<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">从编辑到生效：两次“保存”分别做什么？</title>
<desc id="desc">规则弹窗保存只更新草稿，底部保存并应用才保存配置并顺序下发内核；监控可能显示部分成功。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9" fill="#7454a7"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1200" height="790" rx="0" fill="#f7f5fb"/>
<text x="48" y="42" font-size="16" fill="#7454a7" font-weight="600" text-anchor="start">SUSFS 0.3.0 · 配置教学图</text>
<text x="48" y="88" font-size="32" fill="#282236" font-weight="700" text-anchor="start">从编辑到生效：两次“保存”分别做什么？</text>
<text x="48" y="123" font-size="20" fill="#696176" font-weight="400" text-anchor="start">新增、修改、删除规则及作用组后，都要完成“保存并应用”。</text>
<rect x="48" y="158" width="258" height="255" rx="18" fill="#ffffff" stroke="#ded6ed" stroke-width="1.5"/>
<circle cx="83" cy="194" r="19" fill="#7454a7"/>
<text x="83" y="201" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="68" y="243" font-size="23" fill="#282236" font-weight="700" text-anchor="start">编辑规则或作用组</text>
<text x="68" y="284" font-size="18" fill="#696176" font-weight="400" text-anchor="start">填写路径与参数，</text>
<text x="68" y="315" font-size="18" fill="#696176" font-weight="400" text-anchor="start">选择需要的作用组。</text>
<text x="68" y="346" font-size="18" fill="#696176" font-weight="400" text-anchor="start">取消弹窗会放弃本次编辑。</text>
<path d="M310 285 L325 285" fill="none" stroke="#7454a7" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="330" y="158" width="258" height="255" rx="18" fill="#ffffff" stroke="#ded6ed" stroke-width="1.5"/>
<circle cx="365" cy="194" r="19" fill="#7454a7"/>
<text x="365" y="201" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="350" y="243" font-size="23" fill="#282236" font-weight="700" text-anchor="start">弹窗“保存规则”</text>
<text x="350" y="284" font-size="18" fill="#696176" font-weight="400" text-anchor="start">关闭弹窗，更新页面草稿。</text>
<text x="350" y="315" font-size="18" fill="#696176" font-weight="400" text-anchor="start">此时尚未保存到配置文件，</text>
<text x="350" y="346" font-size="18" fill="#696176" font-weight="400" text-anchor="start">内核规则也尚未改变。</text>
<path d="M592 285 L607 285" fill="none" stroke="#7454a7" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="612" y="158" width="258" height="255" rx="18" fill="#ffffff" stroke="#ded6ed" stroke-width="1.5"/>
<circle cx="647" cy="194" r="19" fill="#7454a7"/>
<text x="647" y="201" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="632" y="243" font-size="23" fill="#282236" font-weight="700" text-anchor="start">底部“保存并应用”</text>
<text x="632" y="284" font-size="18" fill="#696176" font-weight="400" text-anchor="start">有改动时才显示悬浮按钮。</text>
<text x="632" y="315" font-size="18" fill="#696176" font-weight="400" text-anchor="start">写入配置，并依次清理、</text>
<text x="632" y="346" font-size="18" fill="#696176" font-weight="400" text-anchor="start">添加各类规则与高级项。</text>
<path d="M874 285 L889 285" fill="none" stroke="#7454a7" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="894" y="158" width="258" height="255" rx="18" fill="#ffffff" stroke="#ded6ed" stroke-width="1.5"/>
<circle cx="929" cy="194" r="19" fill="#7454a7"/>
<text x="929" y="201" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="914" y="243" font-size="23" fill="#282236" font-weight="700" text-anchor="start">到监控页检查</text>
<text x="914" y="284" font-size="18" fill="#696176" font-weight="400" text-anchor="start">查看规则状态和运行诊断。</text>
<text x="914" y="315" font-size="18" fill="#696176" font-weight="400" text-anchor="start">展开“逐项应用结果”，</text>
<text x="914" y="346" font-size="18" fill="#696176" font-weight="400" text-anchor="start">核对失败或未执行项目。</text>
<rect x="48" y="451" width="1104" height="239" rx="18" fill="#ffffff" stroke="#ded6ed" stroke-width="1.5"/>
<text x="74" y="492" font-size="24" fill="#282236" font-weight="700" text-anchor="start">看到状态后，下一步这样做</text>
<text x="76" y="539" font-size="20" fill="#246b53" font-weight="700" text-anchor="start">全部成功</text>
<text x="340" y="539" font-size="20" fill="#696176" font-weight="400" text-anchor="start">配置已保存，相关步骤已应用。</text>
<text x="76" y="588" font-size="20" fill="#8d5624" font-weight="700" text-anchor="start">部分应用</text>
<text x="340" y="588" font-size="20" fill="#696176" font-weight="400" text-anchor="start">已成功步骤会保留；检查失败项。</text>
<text x="76" y="637" font-size="20" fill="#696176" font-weight="700" text-anchor="start">未执行 / 状态未确认</text>
<text x="340" y="637" font-size="20" fill="#696176" font-weight="400" text-anchor="start">先检查诊断与内核能力，勿当成成功。</text>
<text x="48" y="730" font-size="17" fill="#696176" font-weight="400" text-anchor="start">手动“刷新”只读取状态；它不会重新应用规则，也不会重新预读重定向目标。</text>
<text x="48" y="765" font-size="15" fill="#696176" font-weight="400" text-anchor="start">0.3.0 教学示意 · 以当前界面及内核能力为准 · 不是设备效果证据</text>
</g>
</svg>
