# SPDX-License-Identifier: GPL-2.0-only
name: module-zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve tag
        id: t
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ steps.t.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern 'susfs_guard_lkm-*.ko' --pattern 'susfs_insmod' --dir assets
      - name: Package module
        run: |
          python tools/pack_module.py --ko-dir assets --insmod assets/susfs_insmod \
            --tag "${{ steps.t.outputs.tag }}" \
            --out "dist/susfs_guard_lkm-module-${{ steps.t.outputs.tag }}-arm64.zip"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.t.outputs.tag }}" dist/*.zip --repo "${{ github.repository }}" --clobber
