<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f6f8" />
  <title>拦截目标配置</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f6f8;
      --surface: #ffffff;
      --text: #202938;
      --muted: #7b8492;
      --line: #e8ebef;
      --blue: #2875df;
      --blue-hover: #1f65c5;
      --green: #159b69;
      --red: #d94b50;
      --amber: #a87522;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      color: var(--text);
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    button, input { font: inherit; }

    .panel {
      width: 100%;
      max-width: 480px;
      margin: 28px 0;
      padding: 26px;
      border: 1px solid #eceff2;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 5px 20px rgba(25, 39, 60, .045);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0;
    }

    .intro {
      margin: 6px 0 23px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      color: #111827;
      font-size: 14px;
      font-weight: 650;
    }

    .input-row {
      display: flex;
      gap: 9px;
    }

    .input-row input {
      flex: 1;
      width: 100%;
      min-width: 0;
      height: 48px;
      padding: 0 13px;
      border: 1px solid #cbd2dc;
      border-radius: 8px;
      outline: none;
      color: #111111;
      caret-color: #111111;
      background: #fff;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 16px;
      font-weight: 500;
      -webkit-text-fill-color: #111111;
    }

    .input-row input::placeholder {
      color: #7b8492;
      opacity: 1;
      -webkit-text-fill-color: #7b8492;
    }

    .input-row input:focus {
      border-color: #78a8e8;
      box-shadow: 0 0 0 3px rgba(40, 117, 223, .09);
    }

    .button {
      min-height: 48px;
      padding: 0 17px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    .button:disabled { cursor: wait; opacity: .6; }

    .button-save {
      flex: 0 0 auto;
      color: #fff;
      background: var(--blue);
    }

    .button-save:hover { background: var(--blue-hover); }

    .restart-tip {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 13px;
      color: var(--amber);
      font-size: 13px;
      line-height: 1.6;
    }

    .restart-tip::before {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      margin-top: 6px;
      border-radius: 50%;
      background: #d6a34d;
      content: "";
    }

    .divider {
      height: 1px;
      margin: 24px 0 18px;
      background: var(--line);
    }

    .status-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .status-heading h2 {
      margin: 0;
      color: #465160;
      font-size: 14px;
      font-weight: 650;
    }

    .button-refresh {
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid #dfe5ec;
      color: #586577;
      background: #fff;
      font-size: 12px;
      font-weight: 500;
    }

    .button-refresh:hover { background: #f7f8fa; }

    .status-line {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid #edf0f3;
      border-radius: 8px;
      background: #fafbfc;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: #aab2bd;
    }

    .status-text {
      color: #626d7b;
      font-size: 13px;
      font-weight: 600;
    }

    .status-detail {
      margin-left: auto;
      color: #929ba7;
      font-size: 11px;
      white-space: nowrap;
    }

    .status-line + .status-line { margin-top: 8px; }

    .status-line.bad .status-dot { background: var(--red); }
    .status-line.bad .status-text { color: var(--red); }
    .status-line.ok .status-dot { background: var(--green); }
    .status-line.ok .status-text { color: var(--green); }
    .status-line.warn .status-dot { background: var(--amber); }
    .status-line.warn .status-text { color: var(--amber); }

    .status-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 9px;
      color: #929ba7;
      font-size: 11px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 10;
      max-width: calc(100vw - 32px);
      padding: 10px 15px;
      border-radius: 8px;
      color: #fff;
      background: rgba(35, 43, 55, .94);
      box-shadow: 0 5px 18px rgba(20, 30, 45, .16);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 7px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .panel { margin: 12px 0; padding: 21px 18px; }
      .input-row { flex-direction: column; }
      .input-row input { width: 100%; min-height: 48px; }
      .button-save { width: 100%; }
      .status-detail { font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>拦截目标配置</h1>
    <p class="intro">设置需要禁止运行的应用包名。</p>

    <section aria-label="拦截目标配置">
      <label class="field-label" for="pkgInput">应用包名</label>
      <div class="input-row">
        <input
          id="pkgInput"
          type="text"
          placeholder="请输入包名"
          autocomplete="off"
          spellcheck="false"
          maxlength="255"
        />
        <button class="button button-save" id="saveBtn" type="button">保存配置</button>
      </div>
      <div class="restart-tip">保存后需重启设备生效</div>
    </section>

    <div class="divider"></div>

    <section aria-labelledby="statusHeading" aria-live="polite">
      <div class="status-heading">
        <h2 id="statusHeading">目标状态</h2>
        <button class="button button-refresh" id="refreshBtn" type="button">刷新检测</button>
      </div>
      <div class="status-line" id="pkgLine">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text" id="pkgText">正在检测包名…</span>
      </div>
      <div class="status-line" id="runLine">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text" id="runText">正在检测进程…</span>
        <span class="status-detail">每 5 秒自动检测</span>
      </div>
      <div class="status-meta">
        <span>上次检测</span>
        <span id="lastChecked">尚未检测</span>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // 状态文案集中在这里，改措辞只动这一块
    const STATUS_TEXT = {
      checkingPkg: "正在检测包名…",
      checkingRun: "正在检测进程…",
      pkgExists: "包名存在",
      pkgMissing: "包名不存在，请检查输入",
      pkgListError: "应用列表读取失败",
      procRunning: "运行中，拦截未生效",
      procStopped: "拦截生效，未检测到进程",
      procSkipped: "包名不存在，跳过进程检测",
      procError: "进程检测失败",
      checkFailed: "检测失败"
    };

    let checkInFlight = false;
    let toastTimer = null;

    async function postText(path, bodyText = "") {
      const url = new URL(path, window.location.href);
      const response = await fetch(url, {
        method: "POST",
        body: bodyText,
        cache: "no-store"
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      return (await response.text()).trim();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function setLineState(lineId, textId, state, message) {
      const line = document.getElementById(lineId);
      const text = document.getElementById(textId);
      line.classList.remove("ok", "bad", "warn");
      if (state) line.classList.add(state);
      text.textContent = message;
    }

    // 包名存在性：exists 存在 / missing 不存在 / error 应用列表读取失败
    function renderPackageState(state) {
      if (state === "exists") {
        setLineState("pkgLine", "pkgText", "ok", STATUS_TEXT.pkgExists);
        return true;
      }
      if (state === "missing") {
        setLineState("pkgLine", "pkgText", "warn", STATUS_TEXT.pkgMissing);
        return false;
      }
      setLineState("pkgLine", "pkgText", "warn", STATUS_TEXT.pkgListError);
      return null;
    }

    function renderProcessState(state, pkgExists) {
      if (pkgExists === false) {
        setLineState("runLine", "runText", "", STATUS_TEXT.procSkipped);
        return;
      }
      if (state === "running") {
        setLineState("runLine", "runText", "bad", STATUS_TEXT.procRunning);
      } else if (state === "stopped") {
        setLineState("runLine", "runText", "ok", STATUS_TEXT.procStopped);
      } else {
        setLineState("runLine", "runText", "warn", STATUS_TEXT.procError);
      }
    }

    function updateCheckTime() {
      document.getElementById("lastChecked").textContent = new Date().toLocaleTimeString("zh-CN", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      });
    }

    async function loadConfig() {
      const pkg = await postText("/getTargetPkg");
      document.getElementById("pkgInput").value = pkg;
    }

    async function checkState(showLoading = false) {
      if (checkInFlight) return;
      checkInFlight = true;
      if (showLoading) {
        setLineState("pkgLine", "pkgText", "", STATUS_TEXT.checkingPkg);
        setLineState("runLine", "runText", "", STATUS_TEXT.checkingRun);
      }

      try {
        const [pkgState, procState] = await Promise.all([
          postText("/checkPackage"),
          postText("/checkProcess")
        ]);
        const pkgExists = renderPackageState(pkgState);
        renderProcessState(procState, pkgExists);
      } catch (error) {
        console.error("checkState failed:", error);
        setLineState("pkgLine", "pkgText", "warn", STATUS_TEXT.checkFailed);
        setLineState("runLine", "runText", "warn", STATUS_TEXT.checkFailed);
      } finally {
        updateCheckTime();
        checkInFlight = false;
      }
    }

    async function refresh() {
      const button = document.getElementById("refreshBtn");
      button.disabled = true;
      const configTask = loadConfig().catch(error => {
        console.error("loadConfig failed:", error);
        showToast("读取目标包名失败：" + error.message);
      });
      await Promise.all([configTask, checkState(true)]);
      button.disabled = false;
    }

    async function save() {
      const input = document.getElementById("pkgInput");
      const button = document.getElementById("saveBtn");
      const pkg = input.value.trim();

      if (!pkg) {
        showToast("请输入目标应用包名");
        input.focus();
        return;
      }

      button.disabled = true;
      try {
        const result = await postText("/setTargetPkg", pkg);
        if (result === "OK") {
          showToast("保存成功，重启设备后生效");
        } else {
          showToast("保存失败：" + (result || "未知错误"));
        }
      } catch (error) {
        console.error("save config failed:", error);
        showToast("保存失败：" + error.message);
      } finally {
        button.disabled = false;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      refresh();
      window.setInterval(() => checkState(false), 5000);
      document.getElementById("refreshBtn").addEventListener("click", refresh);
      document.getElementById("saveBtn").addEventListener("click", save);
      document.getElementById("pkgInput").addEventListener("keydown", event => {
        if (event.key === "Enter") save();
      });
    });
  </script>
</body>
</html>
